<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>培训记录册生成工具</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f7fa;
            color: #333;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .env-warning {
            display: none;
            width: 100%;
            background-color: #fffaf0;
            border-bottom: 1px solid #feebc8;
            color: #dd6b20;
            padding: 12px 20px;
            text-align: center;
            font-size: 13px;
            box-sizing: border-box;
            font-weight: bold;
        }
        
        .container {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 100%;
            width: 550px;
            box-sizing: border-box;
            margin: 20px 10px;
        }
        
        h2 {
            margin-top: 0;
            color: #2c3e50;
            text-align: center;
            font-size: 20px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #4a5568;
            font-size: 14px;
        }
        
        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
            background-color: #fff;
        }
        
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #3182ce;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn-submit:hover { background-color: #2b6cb0; }
        .btn-submit:disabled { background-color: #cbd5e0; cursor: not-allowed; }
        
        .tips {
            background-color: #ebf8ff;
            border-left: 4px solid #3182ce;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 13px;
            color: #2b6cb0;
            line-height: 1.4;
        }
        
        .template-info {
            background-color: #e6fffa;
            border-left: 4px solid #38a169;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 13px;
            color: #276749;
            line-height: 1.4;
        }
        
        .status-msg {
            text-align: center;
            font-size: 14px;
            margin-top: 10px;
            color: #4a5568;
            font-weight: bold;
            white-space: pre-wrap;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            min-height: 60px;
        }
        
        .counter-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
            font-size: 13px;
            color: #718096;
        }
        
        .counter-badge {
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 10px;
            background: #edf2f7;
        }
        .counter-badge.normal { color: #38a169; background: #e6fffa; }
        .counter-badge.warning { color: #dd6b20; background: #fffaf0; }
        
        .btn-home {
            display: inline-block;
            padding: 6px 12px;
            background-color: #718096;
            color: white;
            border-radius: 4px;
            text-decoration: none;
            font-size: 13px;
            margin-bottom: 10px;
        }
        .btn-home:hover { background-color: #4a5568; }
    </style>
    
    <script>
        window.onload = function() {
            const ua = navigator.userAgent.toLowerCase();
            if (ua.match(/MicroMessenger/i) == "micromessenger" || ua.match(/QQ/i) == "qq") {
                document.getElementById('env-warning').style.display = 'block';
            }
        };
    </script>
</head>

<body>

<div id="env-warning" class="env-warning">
    ⚠️ 检测到您正在使用微信/QQ内置浏览器，可能会导致文档下载被拦截。建议点击右上角选择"在浏览器中打开"。
</div>

<div class="container">
    <a href="index.html" class="btn-home">← 返回首页</a>
    <h2>培训记录册生成工具</h2>
    
    <div class="template-info">
        <strong>📄 当前模板：记录册模板.xlsx（自动加载）</strong><br>
        模板已自动加载，无需手动上传
    </div>
    
    <div class="tips">
        <strong>📝 功能说明：</strong><br>
        • 上传数据源 Excel<br>
        • 自动为每条记录生成独立记录册<br>
        • 按姓名命名工作表，培训记录按照时间线排序
    </div>

    <div class="form-group">
        <label for="dataFile">1. 上传数据源 Excel</label>
        <input type="file" id="dataFile" accept=".xlsx" onchange="updateDataInfo()">
        <div class="counter-container" id="data-info" style="display:none;">
            <span id="data-hint">数据解析中...</span>
            <span id="data-badge" class="counter-badge normal">0 条记录</span>
        </div>
    </div>

    <button id="generateBtn" class="btn-submit" onclick="processExcel()" disabled>生成多表并执行表内排序</button>
    
    <div id="status" class="status-msg">等待上传数据源...</div>
</div>

<script>
    const TEMPLATE_FILE = '模板/记录册模板.xlsx';
    const statusEl = document.getElementById('status');

    function log(msg) { 
        statusEl.innerText = msg;
        if (msg.includes('成功') || msg.includes('完成')) {
            statusEl.style.color = '#38a169';
        } else if (msg.includes('错误') || msg.includes('失败')) {
            statusEl.style.color = '#e53e3e';
        } else {
            statusEl.style.color = '#4a5568';
        }
    }

    function updateDataInfo() {
        const file = document.getElementById('dataFile').files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = async (e) => {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = new ExcelJS.Workbook();
                await workbook.xlsx.load(data);
                const sheet = workbook.worksheets[0];
                const rowCount = sheet.rowCount - 1; // 减去表头
                
                document.getElementById('data-info').style.display = 'flex';
                document.getElementById('data-badge').innerText = `${rowCount} 条记录`;
                document.getElementById('data-badge').className = rowCount > 100 ? 'counter-badge warning' : 'counter-badge normal';
                document.getElementById('data-hint').innerText = '数据源已识别';
                
                checkReadyState();
            } catch (e) {
                document.getElementById('data-hint').innerText = 'Excel 解析失败';
                document.getElementById('data-badge').className = 'counter-badge warning';
            }
        };
        reader.readAsArrayBuffer(file);
    }

    function checkReadyState() {
        const dataFile = document.getElementById('dataFile').files[0];
        const btn = document.getElementById('generateBtn');
        
        if (dataFile) {
            btn.disabled = false;
            log('数据源已就绪，点击按钮开始生成');
        } else {
            btn.disabled = true;
            log('等待上传数据源...');
        }
    }

    async function processExcel() {
        const dataFile = document.getElementById('dataFile').files[0];
        const btn = document.getElementById('generateBtn');

        if (!dataFile) {
            alert("请先上传数据源文件！");
            return;
        }

        btn.disabled = true;
        log("正在读取文件...");

        try {
            // 加载本地模板
            log("正在加载本地模板...");
            let templateBuffer;
            try {
                const response = await fetch(TEMPLATE_FILE);
                if (!response.ok) {
                    throw new Error(`无法加载模板文件: ${TEMPLATE_FILE}，请确保通过HTTP服务器访问此页面`);
                }
                templateBuffer = await response.arrayBuffer();
                log("模板加载成功！");
            } catch (e) {
                log("❌ 模板加载失败: " + e.message);
                log("提示：请使用 HTTP 服务器访问此页面（如 python -m http.server 8080）");
                btn.disabled = false;
                return;
            }

            const dataWb = new ExcelJS.Workbook();
            const templateWb = new ExcelJS.Workbook();

            // 禁用公式缓存，避免共享公式复制错误
            await dataWb.xlsx.load(await dataFile.arrayBuffer(), { formulaCache: false });
            await templateWb.xlsx.load(templateBuffer, { formulaCache: false });

            const dataSheet = dataWb.worksheets[0];
            const templateSheet = templateWb.worksheets[0];

            const sourceStartRow = 2; // 数据源从第 2 行开始
            const dataRowCount = dataSheet.rowCount;
            const nameColumnIndexInSource = 4; // 姓名列位置

            function getTimestamp(val) {
                if (!val) return Infinity;
                if (val instanceof Date) return val.getTime();
                const d = new Date(val);
                return isNaN(d.getTime()) ? Infinity : d.getTime();
            }

            log(`开始处理 ${dataRowCount - 1} 条记录...`);

            for (let r = sourceStartRow; r <= dataRowCount; r++) {
                const sourceRow = dataSheet.getRow(r);
                if (!sourceRow.hasValues) continue; 

                let personName = sourceRow.getCell(nameColumnIndexInSource).value;
                
                if (!personName) personName = `未命名_${r}`;
                personName = String(personName).replace(/[\\/?*\[\]]/g, '');
                personName = personName.substring(0, 31);

                let finalSheetName = personName;
                let counter = 1;
                while (templateWb.getWorksheet(finalSheetName)) {
                    finalSheetName = `${personName}_${counter}`;
                    counter++;
                }
                
                const newSheet = templateWb.addWorksheet(finalSheetName, {
                    properties: { sheetProperties: { workbookViewId: 0 } }
                });
                
                // 禁用共享公式，避免复制错误
                newSheet.sharedFormulaCache = null;
                
                // 完美复制模板格式
                for(let colIdx = 1; colIdx <= 30; colIdx++) {
                    const col = templateSheet.getColumn(colIdx);
                    if(col && col.width) newSheet.getColumn(colIdx).width = col.width;
                }
                templateSheet.eachRow({ includeEmpty: true }, (row, rowNumber) => {
                    const newRow = newSheet.getRow(rowNumber);
                    if (row.height) newRow.height = row.height;
                    row.eachCell({ includeEmpty: true }, (cell, colNumber) => {
                        const newCell = newRow.getCell(colNumber);
                        // 处理公式和值
                        if (cell.value !== undefined && cell.value !== null) {
                            if (typeof cell.value === 'object') {
                                // 如果是公式对象，尝试获取计算结果值
                                if (cell.value.formula) {
                                    // 如果有计算结果，使用计算结果（断开共享公式链）
                                    newCell.value = cell.value.result !== undefined ? cell.value.result : cell.value.formula;
                                } else if (cell.value.richText) {
                                    // 富文本
                                    newCell.value = cell.value;
                                } else if (cell.value.sharedFormula) {
                                    // 共享公式转为普通值
                                    newCell.value = cell.value.result !== undefined ? cell.value.result : '';
                                } else {
                                    newCell.value = cell.value;
                                }
                            } else {
                                // 普通值
                                newCell.value = cell.value;
                            }
                        }
                        if (cell.style) newCell.style = Object.assign({}, cell.style);
                    });
                });
                if (templateSheet.model && templateSheet.model.merges) {
                    templateSheet.model.merges.forEach(merge => newSheet.mergeCells(merge));
                }

                // 数据填入规则
                const fillRules = [
                    // 表头
                    { sourceCol: 6, targetCell: 'A1' },
                    // 安全通识
                    { sourceCol: 19, targetCell: 'H4' },
                    { sourceCol: 19, targetCell: 'H5' },
                    { sourceCol: 19, targetCell: 'H6' },
                    { sourceCol: 19, targetCell: 'H7' },
                    { sourceCol: 19, targetCell: 'H8' },
                    { sourceCol: 19, targetCell: 'H9' },
                    
                    // 公共区
                    { sourceCol: 17, targetCell: 'H10' },
                    { sourceCol: 17, targetCell: 'H11' },
                    { sourceCol: 17, targetCell: 'H12' },
                    // 股份
                    { sourceCol: 33, targetCell: 'H13' },
                    { sourceCol: 33, targetCell: 'H14' },
                    { sourceCol: 33, targetCell: 'H15' },
                    { sourceCol: 33, targetCell: 'H16' },
                    { sourceCol: 33, targetCell: 'H17' },
                    { sourceCol: 33, targetCell: 'H18' },
                    // 安全法律法规
                    { sourceCol: 19, targetCell: 'H19' },
                    { sourceCol: 19, targetCell: 'H20' },
                    
                    // 职业健康教育
                    { sourceCol: 21, targetCell: 'H21' },
                    { sourceCol: 21, targetCell: 'H22' },
                    // 安全技能培训
                    { sourceCol: 10, targetCell: 'H23' },
                    { sourceCol: 10, targetCell: 'H24' },
                    
                    // 分数
                    // 安全通识
                    { sourceCol: 20, targetCell: 'O4' },
                    { sourceCol: 20, targetCell: 'O5' },
                    { sourceCol: 20, targetCell: 'O6' },
                    { sourceCol: 20, targetCell: 'O7' },
                    { sourceCol: 20, targetCell: 'O8' },
                    { sourceCol: 20, targetCell: 'O9' },
                    
                    // 公共区
                    { sourceCol: 18, targetCell: 'O10' },
                    { sourceCol: 18, targetCell: 'O11' },
                    { sourceCol: 18, targetCell: 'O12' },
                    // 股份
                    { sourceCol: 34, targetCell: 'O13' },
                    { sourceCol: 34, targetCell: 'O14' },
                    { sourceCol: 34, targetCell: 'O15' },
                    { sourceCol: 34, targetCell: 'O16' },
                    { sourceCol: 34, targetCell: 'O18' },
                    // 安全法律法规
                    { sourceCol: 20, targetCell: 'O19' },
                    { sourceCol: 20, targetCell: 'O20' },
                    
                    // 职业健康教育
                    { sourceCol: 22, targetCell: 'O21' },
                    { sourceCol: 22, targetCell: 'O22' },
                    // 安全技能培训
                    { sourceCol: 11, targetCell: 'O23' },
                    { sourceCol: 12, targetCell: 'O24' }
                ];

                fillRules.forEach(rule => {
                    let rawValue = sourceRow.getCell(rule.sourceCol).value;
                    let finalValue = rawValue;
                
                    if (rawValue && typeof rawValue === 'object') {
                        if (rawValue.result !== undefined) {
                            finalValue = rawValue.result;
                        } else if (rawValue.richText) {
                            finalValue = rawValue.richText.map(rt => rt.text).join('');
                        }
                    }
                
                    newSheet.getCell(rule.targetCell).value = finalValue;
                });

                // 表内排序
                const startSortRow = 4;
                let lastRow = startSortRow;

                newSheet.eachRow({ includeEmpty: false }, function(row, rowNumber) {
                    if (rowNumber >= startSortRow) {
                        let hasValue = false;
                        for (let c = 1; c <= 16; c++) {
                            if (row.getCell(c).value) { hasValue = true; break; }
                        }
                        if (hasValue && rowNumber > lastRow) lastRow = rowNumber;
                    }
                });

                let sortRowsData = [];
                for (let sr = startSortRow; sr <= lastRow; sr++) {
                    let rowValues = [];
                    for (let sc = 1; sc <= 16; sc++) {
                        rowValues.push(newSheet.getCell(sr, sc).value);
                    }
                    const timeValue = newSheet.getCell(sr, 8).value;
                    sortRowsData.push({ values: rowValues, timeKey: timeValue });
                }

                sortRowsData.sort((a, b) => getTimestamp(a.timeKey) - getTimestamp(b.timeKey));

                for (let i = 0; i < sortRowsData.length; i++) {
                    const targetRow = startSortRow + i;
                    for (let sc = 1; sc <= 16; sc++) {
                        newSheet.getCell(targetRow, sc).value = sortRowsData[i].values[sc - 1];
                    }
                }
            }

            log("正在生成并导出文件...");
            templateWb.removeWorksheet(templateSheet.id);
            const buffer = await templateWb.xlsx.writeBuffer();
            const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
            
            try {
                saveAs(blob, "已生成多页_以姓名命名.xlsx");
                log("🎉 处理成功！文件已开始下载");
            } catch (downloadError) {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = "已生成多页_以姓名命名.xlsx";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                log("⚠️ 已尝试备用下载方式");
            }

        } catch (error) {
            console.error("处理出错:", error);
            log("❌ 处理失败: " + error.message);
            alert("处理失败，请查看控制台日志。");
        } finally {
            setTimeout(() => { checkReadyState(); }, 2000);
        }
    }
</script>

</body>
</html>
