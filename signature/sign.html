<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>在线签名签署</title>
  
  <link rel="stylesheet" href="../lib/base.css">
  <style>
    canvas { 
      display: block; 
      margin: 0 auto 20px auto; 
      width: 100%; 
      height: 200px; 
      box-sizing: border-box; 
      border: 2px dashed var(--gray-300); 
      border-radius: var(--border-radius-sm); 
      touch-action: none; 
      background: white;
    }
    
    #submit-btn { background: var(--primary-color); }
    #submit-btn:hover { background: var(--primary-hover); }
    
    #clear-btn { background: var(--gray-400); }
    #clear-btn:hover { background: var(--gray-500); }
  </style>
</head>

<body>

<div id="env-warning" class="env-warning">
    ⚠️ 检测到您正在使用微信/QQ内置浏览器，可能会导致文档下载被拦截。建议点击右上角选择"在浏览器中打开"。
</div>

<div class="container container-narrow">
  <a href="../index.html" class="btn-home">← 返回首页</a>
  <h2>📝 在线文书签署</h2>
  
  <div id="error-message" class="error-message" style="display:none;">
    ⚠️ 该签署链接已失效或不存在
  </div>
  
  <div id="sign-form">
    <div class="form-group">
      <label>请输入您的真实姓名</label>
      <input type="text" id="username-input" placeholder="姓名将作为已签署的文件名">
    </div>
    
    <div class="form-group">
      <label>请在下方虚线框内手写签名</label>
      <div class="hint">💡 提示：使用鼠标或触摸屏在下方区域书写您的签名</div>
      <canvas id="signature-pad"></canvas>
    </div>
    
    <div class="btn-group">
      <button id="clear-btn">重写</button>
      <button id="submit-btn">确认提交签名</button>
    </div>
  </div>
</div>

<script src="../lib/base.js"></script>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const templateId = urlParams.get('templateId');

    async function showError(msg) {
      document.getElementById('error-message').textContent = '⚠️ ' + msg;
      document.getElementById('error-message').style.display = 'block';
      document.getElementById('sign-form').style.display = 'none';
    }

    async function validateTemplate() {
      if (!templateId) {
        showError('缺少模板ID');
        return;
      }
      
      try {
        const response = await fetch(`/api/template?templateId=${templateId}&type=exists`);
        const data = await response.json();
        if (!data.exists) {
          showError('该签署链接已失效或不存在');
        }
      } catch (e) {
        showError('网络连接失败，请稍后重试');
      }
    }

    validateTemplate();

    const sig = Signature.initCanvas('signature-pad');

    document.getElementById('clear-btn').addEventListener('click', () => {
      sig.clear();
    });

    document.getElementById('submit-btn').addEventListener('click', async () => {
      const userName = document.getElementById('username-input').value.trim();
      if (!userName) return App.showMessage('请输入姓名', 'warning');

      const signatureImage = sig.getImageData();
      if (!signatureImage) return App.showMessage('请先手写签名后再提交！', 'warning');

      try {
        await Signature.submitSignature(templateId, userName, signatureImage);
        App.showMessage('签署成功！您可以关闭当前窗口。', 'success');
        sig.clear();
        document.getElementById('username-input').value = '';
      } catch (e) {
        App.showMessage(e.message, 'error');
        if (e.message.includes('失效')) {
          showError(e.message);
        }
      }
    });
</script>
</body>
</html>
