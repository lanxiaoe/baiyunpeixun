<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF 全功能签字后台</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  
  <link rel="stylesheet" href="../lib/base.css">
  <style>
    .container { width: 900px; margin: 30px auto; }
    h2 { font-size: 22px; }
    
    /* PDF 相关样式 */
    .pagination { margin: 15px 0; font-weight: bold; color: var(--gray-600); }
    #pdf-wrapper { margin-top: 15px; }
    #pdf-container { position: relative; border: 2px dashed var(--gray-300); display: inline-block; cursor: crosshair; user-select: none; background: white; }
    #marker { position: absolute; border: 2px dashed var(--danger-color); background: rgba(229,62,62,0.1); display: none; pointer-events: none; }
    
    /* 登录面板样式 */
    #login-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-card {
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .login-input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid var(--gray-200);
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 20px;
    }

    .login-input:focus { border-color: var(--primary-color); outline: none; }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn:hover { background: var(--primary-hover); }
    .login-btn:disabled { background: var(--gray-400); cursor: not-allowed; }

    .login-error { color: var(--danger-color); font-size: 14px; margin-top: 15px; display: none; }
    .login-error.show { display: block; }

    .login-remember {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      color: var(--gray-500);
      font-size: 14px;
      margin-bottom: 20px;
    }

    .login-remember input { margin-right: 8px; }

    #admin-panel { display: none; }

    /* 签署人员列表 */
    .signee-list { max-height: 300px; overflow-y: auto; }
    .signee-item { padding: 8px 12px; border-bottom: 1px solid var(--gray-50); color: var(--gray-600); }
    .signee-item:last-child { border-bottom: none; }
    .signee-item:hover { background-color: var(--gray-50); }
    .empty-signees { text-align: center; color: var(--gray-400); padding: 20px; }
  </style>
</head>
<body>

<div id="env-warning" class="env-warning">
    ⚠️ 检测到您正在使用微信/QQ内置浏览器，可能会导致文档下载被拦截。建议点击右上角选择"在浏览器中打开"。
</div>

<!-- 登录面板 -->
<div id="login-panel">
  <div class="login-card">
    <a href="../index.html" class="btn-home" style="float:left;">← 返回首页</a>
    <h2>🔒 管理员登录</h2>
    <p>请输入管理员密码以访问后台管理</p>
    <input type="password" id="login-pwd" class="login-input" placeholder="请输入管理员密码">
    <label class="login-remember">
      <input type="checkbox" id="login-remember"> 记住密码
    </label>
    <button class="login-btn" onclick="login()">登 录</button>
    <div id="login-error" class="login-error">密码错误，请重试</div>
  </div>
</div>

<!-- 管理面板 -->
<div id="admin-panel">
<div class="container">
  <a href="../index.html" class="btn-home">← 返回首页</a>
  <h2>📋 PDF 签字管理后台</h2>

  <div id="progress-overlay" class="progress-overlay">
    <div class="progress-box">
      <h3 id="progress-title" style="margin-top:0;">正在批量处理 PDF</h3>
      <div class="progress-bar-bg">
        <div id="progress-fill" class="progress-bar-fill"></div>
      </div>
      <div id="progress-text" style="font-size:14px; color:#a0aec0;">正在初始化数据结构...</div>
    </div>
  </div>

  <div class="card">
    <h3>📊 已上传模板及签署看板</h3>
    <button onclick="loadTemplateList()" class="btn-secondary">🔄 刷新列表数据</button>
    <table>
      <thead>
        <tr>
          <th>模板 ID</th>
          <th>文件名称</th>
          <th>已签署数量</th>
          <th>已签署人员名单</th>
          <th>管理操作</th>
        </tr>
      </thead>
      <tbody id="template-table-body"></tbody>
    </table>
  </div>

  <div class="card">
    <h3>➕ 上传新 PDF 模板并框选签名处</h3>
    <input type="file" id="pdf-file" accept="application/pdf" style="width: 300px;">
    
    <div id="pdf-wrapper" style="display:none;">
      <div class="pagination">
        <button id="prev-page" class="btn-secondary">◀ 上一页</button>
        <span id="page-num-info">第 1 页 / 共 1 页</span>
        <button id="next-page" class="btn-secondary">下一页 ▶</button>
        <span style="color: var(--gray-500); margin-left: 20px;">💡 提示：在下方 PDF 画面上 [按住左键拖拽] 框选出签名落款区域</span>
      </div>
      <div id="pdf-container">
        <div id="marker"></div>
        <canvas id="pdf-canvas"></canvas>
      </div>
      <br><br>
      <button id="upload-btn" disabled class="btn-primary">保存当前页面及标记并发布</button>
    </div>
    <div id="link-container" style="margin-top: 15px; font-weight: bold; color: var(--success-color);"></div>
  </div>
</div>
</div>

<!-- 签署人员名单弹窗 -->
<div id="signee-modal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>👥 已签署人员名单</h3>
      <button class="close-btn" onclick="closeSigneeModal()">×</button>
    </div>
    <div id="signee-list" class="signee-list"></div>
  </div>
</div>

<script src="../lib/base.js"></script>
<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    let selectedFile = null;
    let pdfDocInstance = null;
    let clickCoords = null;
    let templateId = '';
    let currentPage = 1;
    let totalPages = 1;
    let isDrawingBox = false;
    let startX = 0, startY = 0;
    let adminPassword = '';

    window.addEventListener('load', async () => {
      const savedPwd = localStorage.getItem('admin_pwd');
      if (savedPwd) {
        document.getElementById('login-pwd').value = savedPwd;
        document.getElementById('login-remember').checked = true;
        await autoLogin(savedPwd);
      }

      document.getElementById('login-pwd').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') login();
      });
    });

    async function autoLogin(pwd) {
      try {
        const res = await fetch('/api/template', {
          headers: { 'X-Admin-Password': pwd }
        });
        if (res.status === 200) {
          adminPassword = pwd;
          showAdminPanel();
        }
      } catch (e) {
        console.log('自动登录失败:', e);
      }
    }

    async function login() {
      const pwd = document.getElementById('login-pwd').value;
      const remember = document.getElementById('login-remember').checked;
      const errorDiv = document.getElementById('login-error');
      
      errorDiv.classList.remove('show');
      
      if (!pwd) {
        errorDiv.textContent = '请输入密码';
        errorDiv.classList.add('show');
        return;
      }

      try {
        const res = await fetch('/api/template', {
          headers: { 'X-Admin-Password': pwd }
        });
        
        if (res.status === 200) {
          adminPassword = pwd;
          if (remember) {
            localStorage.setItem('admin_pwd', pwd);
          } else {
            localStorage.removeItem('admin_pwd');
          }
          showAdminPanel();
        } else {
          errorDiv.textContent = '密码错误，请重试';
          errorDiv.classList.add('show');
        }
      } catch (e) {
        errorDiv.textContent = '网络连接失败，请稍后重试';
        errorDiv.classList.add('show');
      }
    }

    function showAdminPanel() {
      document.getElementById('login-panel').style.display = 'none';
      document.getElementById('admin-panel').style.display = 'block';
      loadTemplateList();
    }

    function getHeaders() {
      return { 'X-Admin-Password': adminPassword };
    }

    async function loadTemplateList() {
      const tbody = document.getElementById('template-table-body');
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:20px;">数据加载中...</td></tr>`;
      try {
        const res = await fetch('/api/template', { headers: getHeaders() });
        if (res.status === 401) {
          alert('会话已过期，请重新登录');
          window.location.reload();
          return;
        }
        const data = await res.json();
        
        if (!data.templates || data.templates.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" style="color:var(--gray-400);text-align:center;padding:20px;">暂无上传文件</td></tr>`;
          return;
        }

        tbody.innerHTML = '';
        data.templates.forEach(t => {
          const signUrl = `${window.location.origin}/signature/sign.html?templateId=${t.templateId}`;
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><code style="color:var(--gray-600);">${t.templateId}</code></td>
            <td><strong>${t.fileName}</strong></td>
            <td><b style="color:var(--success-color);">${t.signCount}</b> 份</td>
            <td>
              <button class="btn-secondary" onclick="showSignees('${encodeURIComponent(JSON.stringify(t.signees))}')">
                👥 查看名单 (${t.signCount})
              </button>
            </td>
            <td>
              <button onclick="App.copyToClipboard('${signUrl}')">📋 复制链接</button>
              <button class="btn-success" onclick="batchDownload('${t.templateId}')" ${t.signCount === 0 ? 'disabled' : ''}>📦 打包下载</button>
              <button class="btn-danger" onclick="deleteTemplate('${t.templateId}')">🗑️ 删除模板</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" style="color:var(--danger-color);text-align:center;padding:20px;">错误: ${err.message}</td></tr>`;
      }
    }

    async function deleteTemplate(tId) {
      if (!confirm("⚠️ 警告！\n确定要删除该 PDF 模板吗？\n这将同步且永久抹除掉所有用户的签名图及历史数据，此操作不可逆！")) return;
      try {
        const res = await fetch(`/api/template?templateId=${tId}`, {
          method: 'DELETE',
          headers: getHeaders()
        });
        if (res.ok) {
          App.showMessage('删除成功，底层关联签名记录已同步清理完毕！', 'success');
          loadTemplateList();
        } else {
          const errData = await res.json();
          App.showMessage('删除失败: ' + (errData.error || '未知原因'), 'error');
        }
      } catch(e) {
        App.showMessage('网络请求失败: ' + e.message, 'error');
      }
    }

    function showSignees(signeesJson) {
      const signees = JSON.parse(decodeURIComponent(signeesJson));
      const modal = document.getElementById('signee-modal');
      const listContainer = document.getElementById('signee-list');
      
      if (!signees || signees.length === 0) {
        listContainer.innerHTML = '<div class="empty-signees">暂无人签署</div>';
      } else {
        listContainer.innerHTML = signees.map(name => 
          `<div class="signee-item">✓ ${name}</div>`
        ).join('');
      }
      
      modal.style.display = 'block';
    }

    function closeSigneeModal() {
      document.getElementById('signee-modal').style.display = 'none';
    }

    window.onclick = function(event) {
      const modal = document.getElementById('signee-modal');
      if (event.target === modal) {
        closeSigneeModal();
      }
    };

    document.getElementById('pdf-file').addEventListener('change', async (e) => {
      selectedFile = e.target.files[0];
      if (!selectedFile) return;
      templateId = 'task-' + Math.random().toString(36).substr(2, 9);
      document.getElementById('link-container').innerText = '';
      const fileReader = new FileReader();
      fileReader.onload = async function() {
        const typedarray = new Uint8Array(this.result);
        pdfDocInstance = await pdfjsLib.getDocument(typedarray).promise;
        totalPages = pdfDocInstance.numPages;
        currentPage = 1;
        document.getElementById('pdf-wrapper').style.display = 'block';
        renderPDFPage(currentPage);
      };
      fileReader.readAsArrayBuffer(selectedFile);
    });

    async function renderPDFPage(pageNum) {
      document.getElementById('page-num-info').innerText = `第 ${pageNum} 页 / 共 ${totalPages} 页`;
      document.getElementById('marker').style.display = 'none';
      clickCoords = null;
      document.getElementById('upload-btn').disabled = true;
      const page = await pdfDocInstance.getPage(pageNum);
      const viewport = page.getViewport({ scale: 1.2 });
      const canvas = document.getElementById('pdf-canvas');
      const context = canvas.getContext('2d');
      canvas.height = viewport.height;
      canvas.width = viewport.width;
      await page.render({ canvasContext: context, viewport: viewport }).promise;
    }

    document.getElementById('prev-page').addEventListener('click', () => { if (currentPage > 1) renderPDFPage(--currentPage); });
    document.getElementById('next-page').addEventListener('click', () => { if (currentPage < totalPages) renderPDFPage(++currentPage); });

    const container = document.getElementById('pdf-container');
    container.addEventListener('mousedown', (e) => {
      if (!pdfDocInstance) return;
      const rect = container.getBoundingClientRect();
      startX = e.clientX - rect.left;
      startY = e.clientY - rect.top;
      isDrawingBox = true;
      const marker = document.getElementById('marker');
      marker.style.left = startX + 'px';
      marker.style.top = startY + 'px';
      marker.style.width = '0px';
      marker.style.height = '0px';
      marker.style.display = 'block';
    });

    container.addEventListener('mousemove', (e) => {
      if (!isDrawingBox) return;
      const rect = container.getBoundingClientRect();
      const curX = e.clientX - rect.left;
      const curY = e.clientY - rect.top;
      const w = curX - startX;
      const h = curY - startY;
      const marker = document.getElementById('marker');
      marker.style.width = Math.abs(w) + 'px';
      marker.style.height = Math.abs(h) + 'px';
      marker.style.left = (w < 0 ? curX : startX) + 'px';
      marker.style.top = (h < 0 ? curY : startY) + 'px';
    });

    container.addEventListener('mouseup', async () => {
      if (!isDrawingBox) return;
      isDrawingBox = false;
      const marker = document.getElementById('marker');
      const bLeft = parseFloat(marker.style.left);
      const bTop = parseFloat(marker.style.top);
      const bWidth = parseFloat(marker.style.width);
      const bHeight = parseFloat(marker.style.height);

      if (bWidth < 15 || bHeight < 15) {
        App.showMessage('框选区域太小，请重新清晰框选目标范围！', 'warning');
        marker.style.display = 'none';
        return;
      }

      const page = await pdfDocInstance.getPage(currentPage);
      const pdfViewport = page.getViewport({ scale: 1.0 });
      const canvas = document.getElementById('pdf-canvas');
      const scaleX = pdfViewport.width / canvas.width;
      const scaleY = pdfViewport.height / canvas.height;

      clickCoords = {
        page: currentPage,
        x: bLeft * scaleX,
        y: pdfViewport.height - ((bTop + bHeight) * scaleY),
        width: bWidth * scaleX,
        height: bHeight * scaleY
      };
      document.getElementById('upload-btn').disabled = false;
    });

    document.getElementById('upload-btn').addEventListener('click', async () => {
      if (!selectedFile || !clickCoords) return;
      const formData = new FormData();
      formData.append('file', selectedFile);
      formData.append('meta', JSON.stringify({ coordinate: clickCoords, fileName: selectedFile.name }));
      const res = await fetch(`/api/template?templateId=${templateId}`, {
        method: 'POST',
        headers: getHeaders(),
        body: formData
      });
      if (res.ok) {
        const signUrl = `${window.location.origin}/signature/sign.html?templateId=${templateId}`;
        document.getElementById('link-container').innerHTML = `发布成功！签署链接：<br><a href="${signUrl}" target="_blank" style="color:var(--primary-color);">${signUrl}</a>`;
        loadTemplateList();
      } else {
        App.showMessage("模板创建失败，请核对密码", 'error');
      }
    });

    async function batchDownload(tId) {
      const overlay = document.getElementById('progress-overlay');
      const pFill = document.getElementById('progress-fill');
      const pText = document.getElementById('progress-text');
      
      overlay.style.display = 'flex';
      pFill.style.width = '0%';
      pText.innerText = '正在向服务器建立通道，下载底稿中...';

      try {
        const [templateRes, metaRes, signsRes] = await Promise.all([
          fetch(`/api/template?templateId=${tId}&type=file`, { headers: getHeaders() }),
          fetch(`/api/template?templateId=${tId}&type=meta`, { headers: getHeaders() }),
          fetch(`/api/signatures?templateId=${tId}`, { headers: getHeaders() })
        ]);

        if (!templateRes.ok || !metaRes.ok) throw new Error("获取模板基础数据失败");
        const templateBytes = await templateRes.arrayBuffer();
        const { coordinate, fileName } = await metaRes.json();
        const { signatures } = await signsRes.json();

        if (!signatures || signatures.length === 0) throw new Error("该模板目前还没有任何人签字，无法导出");

        const zip = new JSZip();
        const pureName = fileName.replace(/\.[^/.]+$/, "");
        const total = signatures.length;

        const BATCH_SIZE = 15; 

        for (let i = 0; i < total; i += BATCH_SIZE) {
          const currentBatch = signatures.slice(i, i + BATCH_SIZE);
          
          await Promise.all(currentBatch.map(async (sign) => {
            const pdfDoc = await PDFLib.PDFDocument.load(templateBytes.slice(0));
            const pages = pdfDoc.getPages();
            const targetPage = pages[coordinate.page - 1];

            const imgBytes = Uint8Array.from(atob(sign.signatureImage.split(',')[1]), c => c.charCodeAt(0));
            const signatureImage = await pdfDoc.embedPng(imgBytes);

            const imgW = signatureImage.width;
            const imgH = signatureImage.height;
            const boxW = coordinate.width;
            const boxH = coordinate.height;
            const imgRatio = imgW / imgH;
            const boxRatio = boxW / boxH;

            let drawW = boxW, drawH = boxH, drawX = coordinate.x, drawY = coordinate.y;
            if (imgRatio > boxRatio) {
              drawW = boxW; drawH = boxW / imgRatio; drawY = coordinate.y + (boxH - drawH) / 2;
            } else {
              drawH = boxH; drawW = boxH * imgRatio; drawX = coordinate.x + (boxW - drawW) / 2;
            }

            targetPage.drawImage(signatureImage, { x: drawX, y: drawY, width: drawW, height: drawH });
            const signedPdfBytes = await pdfDoc.save();
            zip.file(`${pureName}_${sign.userName}.pdf`, new Blob([signedPdfBytes], { type: 'application/pdf' }));
          }));

          const processedCount = Math.min(i + BATCH_SIZE, total);
          const percent = Math.floor((processedCount / total) * 100);
          pFill.style.width = percent + '%';
          pText.innerText = `已成功合成: ${processedCount} / ${total} 份文书 (${percent}%)`;
          
          await new Promise(r => setTimeout(r, 40));
        }

        pText.innerText = '✨ 所有的 PDF 已无缝渲染完毕！正在进行高级压缩打包...';
        const content = await zip.generateAsync({ type: 'blob' });
        
        const link = document.createElement('a');
        link.href = URL.createObjectURL(content);
        link.download = `批量签署_${pureName}.zip`;
        link.click();

        overlay.style.display = 'none';

      } catch (err) {
        App.showMessage("打包发生错误: " + err.message, 'error');
        overlay.style.display = 'none';
      }
    }
</script>
</body>
</html>
