<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF 全功能签字后台</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f5f7fa;
      color: #333;
      padding: 0;
      margin: 0;
    }
    
    .env-warning {
      display: none;
      width: 100%;
      background-color: #fffaf0;
      border-bottom: 1px solid #feebc8;
      color: #dd6b20;
      padding: 12px 20px;
      text-align: center;
      font-size: 13px;
      box-sizing: border-box;
      font-weight: bold;
    }
    
    .container {
      background: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      max-width: 100%;
      width: 900px;
      box-sizing: border-box;
      margin: 30px auto;
    }

    .btn-home {
      display: inline-block;
      padding: 6px 12px;
      background-color: #718096;
      color: white;
      border-radius: 4px;
      text-decoration: none;
      font-size: 13px;
      margin-bottom: 15px;
    }
    .btn-home:hover { background-color: #4a5568; }

    h2 {
      margin-top: 0;
      color: #2c3e50;
      font-size: 22px;
      margin-bottom: 20px;
    }

    .card {
      background: #f8f9fa;
      border: 1px solid #e2e8f0;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .card h3 {
      margin-top: 0;
      color: #2c3e50;
      font-size: 16px;
      margin-bottom: 15px;
    }

    button {
      padding: 8px 16px;
      background: #3182ce;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-right: 8px;
      font-size: 14px;
      transition: background 0.2s;
    }
    button:hover { background: #2c5282; }
    button:disabled { background: #a0aec0; cursor: not-allowed; }
    
    .btn-sec { background: #718096; }
    .btn-sec:hover { background: #4a5568; }
    .btn-success { background: #38a169; }
    .btn-success:hover { background: #276749; }
    .btn-danger { background: #e53e3e; }
    .btn-danger:hover { background: #c53030; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: left; }
    th { background-color: #f7fafc; color: #4a5568; font-weight: 600; }
    tr:hover { background-color: #f7fafc; }
    
    .badge {
      background: #ebf8ff;
      color: #3182ce;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
      margin-right: 5px;
      display: inline-block;
      margin-bottom: 4px;
    }
    
    .pagination { margin: 15px 0; font-weight: bold; color: #4a5568; }

    #pdf-wrapper { margin-top: 15px; }
    #pdf-container { position: relative; border: 2px dashed #cbd5e0; display: inline-block; cursor: crosshair; user-select: none; background: white; }
    #marker { position: absolute; border: 2px dashed #e53e3e; background: rgba(229,62,62,0.1); display: none; pointer-events: none; }

    #progress-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); display: none; z-index: 9999;
      flex-direction: column; justify-content: center; align-items: center; color: white;
    }
    .progress-box { background: #2d3748; padding: 30px; border-radius: 8px; text-align: center; max-width: 400px; width: 80%; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    .progress-bar-bg { background: #4a5568; width: 100%; height: 8px; border-radius: 4px; margin: 15px 0; overflow: hidden; }
    .progress-bar-fill { background: #38a169; width: 0%; height: 100%; transition: width 0.1s ease; }

    input[type="password"], input[type="file"] {
      padding: 8px 12px;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      font-size: 14px;
      margin-right: 10px;
    }
  </style>
</head>
<body>

<div id="env-warning" class="env-warning">
    ⚠️ 检测到您正在使用微信/QQ内置浏览器，可能会导致文档下载被拦截。建议点击右上角选择"在浏览器中打开"。
</div>

<div class="container">
  <a href="../index.html" class="btn-home">← 返回首页</a>
  <h2>📋 PDF 签字管理后台</h2>

  <div id="progress-overlay">
    <div class="progress-box">
      <h3 id="progress-title" style="margin-top:0;">正在批量处理 PDF</h3>
      <div class="progress-bar-bg">
        <div id="progress-fill" class="progress-bar-fill"></div>
      </div>
      <div id="progress-text" style="font-size:14px; color:#a0aec0;">正在初始化数据结构...</div>
    </div>
  </div>

  <div class="card">
    <h3>🔒 设置/输入管理员密码</h3>
    <input type="password" id="admin-pwd" style="width: 250px;" placeholder="请输入后台安全密码">
    <button onclick="savePassword()" class="btn-sec">记住密码</button>
  </div>

  <div class="card">
    <h3>📊 已上传模板及签署看板</h3>
    <button onclick="loadTemplateList()" class="btn-sec">🔄 刷新列表数据</button>
    <table>
      <thead>
        <tr>
          <th>模板 ID</th>
          <th>文件名称</th>
          <th>已签署数量</th>
          <th>已签署人员名单</th>
          <th>管理操作</th>
        </tr>
      </thead>
      <tbody id="template-table-body"></tbody>
    </table>
  </div>

  <div class="card">
    <h3>➕ 上传新 PDF 模板并框选签名处</h3>
    <input type="file" id="pdf-file" accept="application/pdf">
    
    <div id="pdf-wrapper" style="display:none;">
      <div class="pagination">
        <button id="prev-page" class="btn-sec">◀ 上一页</button>
        <span id="page-num-info">第 1 页 / 共 1 页</span>
        <button id="next-page" class="btn-sec">下一页 ▶</button>
        <span style="color: #718096; margin-left: 20px;">💡 提示：在下方 PDF 画面上 [按住左键拖拽] 框选出签名落款区域</span>
      </div>
      <div id="pdf-container">
        <div id="marker"></div>
        <canvas id="pdf-canvas"></canvas>
      </div>
      <br><br>
      <button id="upload-btn" disabled>保存当前页面及标记并发布</button>
    </div>
    <div id="link-container" style="margin-top: 15px; font-weight: bold; color: #38a169;"></div>
  </div>
</div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    let selectedFile = null;
    let pdfDocInstance = null;
    let clickCoords = null;
    let templateId = '';
    let currentPage = 1;
    let totalPages = 1;
    let isDrawingBox = false;
    let startX = 0, startY = 0;

    document.getElementById('admin-pwd').value = localStorage.getItem('admin_pwd') || '';
    if (localStorage.getItem('admin_pwd')) loadTemplateList();

    function savePassword() {
      localStorage.setItem('admin_pwd', document.getElementById('admin-pwd').value);
      alert('密码已保存！');
      loadTemplateList();
    }

    function getHeaders() {
      return { 'X-Admin-Password': document.getElementById('admin-pwd').value };
    }

    async function loadTemplateList() {
      const tbody = document.getElementById('template-table-body');
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:20px;">数据加载中...</td></tr>`;
      try {
        const res = await fetch('/api/template', { headers: getHeaders() });
        if (res.status === 401) return tbody.innerHTML = `<tr><td colspan="5" style="color:#e53e3e;text-align:center;padding:20px;">密码验证失败，请重新输入密码！</td></tr>`;
        const data = await res.json();
        
        if (!data.templates || data.templates.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" style="color:#a0aec0;text-align:center;padding:20px;">暂无上传文件</td></tr>`;
          return;
        }

        tbody.innerHTML = '';
        data.templates.forEach(t => {
          const badges = t.signees.map(name => `<span class="badge">${name}</span>`).join('') || '<span style="color:#a0aec0">暂无人签署</span>';
          const signUrl = `${window.location.origin}/signature/sign.html?templateId=${t.templateId}`;
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><code style="color:#4a5568;">${t.templateId}</code></td>
            <td><strong>${t.fileName}</strong></td>
            <td><b style="color:#38a169">${t.signCount}</b> 份</td>
            <td>${badges}</td>
            <td>
              <button onclick="copyToClipboard('${signUrl}')">📋 复制链接</button>
              <button class="btn-success" onclick="batchDownload('${t.templateId}')" ${t.signCount === 0 ? 'disabled' : ''}>📦 打包下载</button>
              <button class="btn-danger" onclick="deleteTemplate('${t.templateId}')">🗑️ 删除模板</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" style="color:#e53e3e;text-align:center;padding:20px;">错误: ${err.message}</td></tr>`;
      }
    }

    async function deleteTemplate(tId) {
      if (!confirm("⚠️ 警告！\n确定要删除该 PDF 模板吗？\n这将同步且永久抹除掉所有用户的签名图及历史数据，此操作不可逆！")) return;
      try {
        const res = await fetch(`/api/template?templateId=${tId}`, {
          method: 'DELETE',
          headers: getHeaders()
        });
        if (res.ok) {
          alert('删除成功，底层关联签名记录已同步清理完毕！');
          loadTemplateList();
        } else {
          const errData = await res.json();
          alert('删除失败: ' + (errData.error || '未知原因'));
        }
      } catch(e) {
        alert('网络请求失败: ' + e.message);
      }
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => alert('签署链接已复制！'));
    }

    document.getElementById('pdf-file').addEventListener('change', async (e) => {
      selectedFile = e.target.files[0];
      if (!selectedFile) return;
      templateId = 'task-' + Math.random().toString(36).substr(2, 9);
      document.getElementById('link-container').innerText = '';
      const fileReader = new FileReader();
      fileReader.onload = async function() {
        const typedarray = new Uint8Array(this.result);
        pdfDocInstance = await pdfjsLib.getDocument(typedarray).promise;
        totalPages = pdfDocInstance.numPages;
        currentPage = 1;
        document.getElementById('pdf-wrapper').style.display = 'block';
        renderPDFPage(currentPage);
      };
      fileReader.readAsArrayBuffer(selectedFile);
    });

    async function renderPDFPage(pageNum) {
      document.getElementById('page-num-info').innerText = `第 ${pageNum} 页 / 共 ${totalPages} 页`;
      document.getElementById('marker').style.display = 'none';
      clickCoords = null;
      document.getElementById('upload-btn').disabled = true;
      const page = await pdfDocInstance.getPage(pageNum);
      const viewport = page.getViewport({ scale: 1.2 });
      const canvas = document.getElementById('pdf-canvas');
      const context = canvas.getContext('2d');
      canvas.height = viewport.height;
      canvas.width = viewport.width;
      await page.render({ canvasContext: context, viewport: viewport }).promise;
    }

    document.getElementById('prev-page').addEventListener('click', () => { if (currentPage > 1) renderPDFPage(--currentPage); });
    document.getElementById('next-page').addEventListener('click', () => { if (currentPage < totalPages) renderPDFPage(++currentPage); });

    const container = document.getElementById('pdf-container');
    container.addEventListener('mousedown', (e) => {
      if (!pdfDocInstance) return;
      const rect = container.getBoundingClientRect();
      startX = e.clientX - rect.left;
      startY = e.clientY - rect.top;
      isDrawingBox = true;
      const marker = document.getElementById('marker');
      marker.style.left = startX + 'px';
      marker.style.top = startY + 'px';
      marker.style.width = '0px';
      marker.style.height = '0px';
      marker.style.display = 'block';
    });

    container.addEventListener('mousemove', (e) => {
      if (!isDrawingBox) return;
      const rect = container.getBoundingClientRect();
      const curX = e.clientX - rect.left;
      const curY = e.clientY - rect.top;
      const w = curX - startX;
      const h = curY - startY;
      const marker = document.getElementById('marker');
      marker.style.width = Math.abs(w) + 'px';
      marker.style.height = Math.abs(h) + 'px';
      marker.style.left = (w < 0 ? curX : startX) + 'px';
      marker.style.top = (h < 0 ? curY : startY) + 'px';
    });

    container.addEventListener('mouseup', async () => {
      if (!isDrawingBox) return;
      isDrawingBox = false;
      const marker = document.getElementById('marker');
      const bLeft = parseFloat(marker.style.left);
      const bTop = parseFloat(marker.style.top);
      const bWidth = parseFloat(marker.style.width);
      const bHeight = parseFloat(marker.style.height);

      if (bWidth < 15 || bHeight < 15) {
        alert('框选区域太小，请重新清晰框选目标范围！');
        marker.style.display = 'none';
        return;
      }

      const page = await pdfDocInstance.getPage(currentPage);
      const pdfViewport = page.getViewport({ scale: 1.0 });
      const canvas = document.getElementById('pdf-canvas');
      const scaleX = pdfViewport.width / canvas.width;
      const scaleY = pdfViewport.height / canvas.height;

      clickCoords = {
        page: currentPage,
        x: bLeft * scaleX,
        y: pdfViewport.height - ((bTop + bHeight) * scaleY),
        width: bWidth * scaleX,
        height: bHeight * scaleY
      };
      document.getElementById('upload-btn').disabled = false;
    });

    document.getElementById('upload-btn').addEventListener('click', async () => {
      if (!selectedFile || !clickCoords) return;
      const formData = new FormData();
      formData.append('file', selectedFile);
      formData.append('meta', JSON.stringify({ coordinate: clickCoords, fileName: selectedFile.name }));
      const res = await fetch(`/api/template?templateId=${templateId}`, {
        method: 'POST',
        headers: getHeaders(),
        body: formData
      });
      if (res.ok) {
        const signUrl = `${window.location.origin}/signature/sign.html?templateId=${templateId}`;
        document.getElementById('link-container').innerHTML = `发布成功！签署链接：<br><a href="${signUrl}" target="_blank" style="color:#3182ce;">${signUrl}</a>`;
        loadTemplateList();
      } else {
        alert("模板创建失败，请核对密码");
      }
    });

    async function batchDownload(tId) {
      const overlay = document.getElementById('progress-overlay');
      const pFill = document.getElementById('progress-fill');
      const pText = document.getElementById('progress-text');
      
      overlay.style.display = 'flex';
      pFill.style.width = '0%';
      pText.innerText = '正在向服务器建立通道，下载底稿中...';

      try {
        const [templateRes, metaRes, signsRes] = await Promise.all([
          fetch(`/api/template?templateId=${tId}&type=file`, { headers: getHeaders() }),
          fetch(`/api/template?templateId=${tId}&type=meta`, { headers: getHeaders() }),
          fetch(`/api/signatures?templateId=${tId}`, { headers: getHeaders() })
        ]);

        if (!templateRes.ok || !metaRes.ok) throw new Error("获取模板基础数据失败");
        const templateBytes = await templateRes.arrayBuffer();
        const { coordinate, fileName } = await metaRes.json();
        const { signatures } = await signsRes.json();

        if (!signatures || signatures.length === 0) throw new Error("该模板目前还没有任何人签字，无法导出");

        const zip = new JSZip();
        const pureName = fileName.replace(/\.[^/.]+$/, "");
        const total = signatures.length;

        const BATCH_SIZE = 15; 

        for (let i = 0; i < total; i += BATCH_SIZE) {
          const currentBatch = signatures.slice(i, i + BATCH_SIZE);
          
          await Promise.all(currentBatch.map(async (sign, index) => {
            const pdfDoc = await PDFLib.PDFDocument.load(templateBytes.slice(0));
            const pages = pdfDoc.getPages();
            const targetPage = pages[coordinate.page - 1];

            const imgBytes = Uint8Array.from(atob(sign.signatureImage.split(',')[1]), c => c.charCodeAt(0));
            const signatureImage = await pdfDoc.embedPng(imgBytes);

            const imgW = signatureImage.width;
            const imgH = signatureImage.height;
            const boxW = coordinate.width;
            const boxH = coordinate.height;
            const imgRatio = imgW / imgH;
            const boxRatio = boxW / boxH;

            let drawW = boxW, drawH = boxH, drawX = coordinate.x, drawY = coordinate.y;
            if (imgRatio > boxRatio) {
              drawW = boxW; drawH = boxW / imgRatio; drawY = coordinate.y + (boxH - drawH) / 2;
            } else {
              drawH = boxH; drawW = boxH * imgRatio; drawX = coordinate.x + (boxW - drawW) / 2;
            }

            targetPage.drawImage(signatureImage, { x: drawX, y: drawY, width: drawW, height: drawH });
            const signedPdfBytes = await pdfDoc.save();
            zip.file(`${pureName}_${sign.userName}.pdf`, new Blob([signedPdfBytes], { type: 'application/pdf' }));
          }));

          const processedCount = Math.min(i + BATCH_SIZE, total);
          const percent = Math.floor((processedCount / total) * 100);
          pFill.style.width = percent + '%';
          pText.innerText = `已成功合成: ${processedCount} / ${total} 份文书 (${percent}%)`;
          
          await new Promise(r => setTimeout(r, 40));
        }

        pText.innerText = '✨ 所有的 PDF 已无缝渲染完毕！正在进行高级压缩打包...';
        const content = await zip.generateAsync({ type: 'blob' });
        
        const link = document.createElement('a');
        link.href = URL.createObjectURL(content);
        link.download = `批量签署_${pureName}.zip`;
        link.click();

        overlay.style.display = 'none';

      } catch (err) {
        alert("打包发生错误: " + err.message);
        overlay.style.display = 'none';
      }
    }

    window.onload = function() {
      const ua = navigator.userAgent.toLowerCase();
      if (ua.match(/MicroMessenger/i) == "micromessenger" || ua.match(/QQ/i) == "qq") {
        document.getElementById('env-warning').style.display = 'block';
      }
    };
  </script>
</body>
</html>
